name: Monitor Asus VG34

on:
  schedule:
    # Executa a cada 30 minutos, 24h por dia
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite você rodar manualmente quando quiser testar

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install beautifulsoup4

      - name: Executar monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar historico no repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json || true
          git commit -m "Atualiza historico de preco [skip ci]" || true
          git push || true
